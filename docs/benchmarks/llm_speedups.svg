<svg xmlns="http://www.w3.org/2000/svg" width="720" height="456" viewBox="0 0 720 456" role="img" aria-labelledby="t d">
<title id="t">b2a_qp speed-ups since the last human-only release</title>
<desc id="d">Human only (Sam Tregar), Mar 4, 2025: 3.3x faster than binascii.b2a_qp; Claude Opus 4.1, Aug 16, 2025: 3.4x faster than binascii.b2a_qp; Claude Fable 5, Jun 9, 2026: 4.9x faster than binascii.b2a_qp; Claude Fable 5.1, Sep 1, 2026: 13x faster than binascii.b2a_qp; GPT-6 Astra, Sep 5, 2026: 17x faster than binascii.b2a_qp; Claude Opus 5.5, Sep 22, 2026: 37x faster than binascii.b2a_qp; Gemini 4, Oct 14, 2026: 42x faster than binascii.b2a_qp; Claude Fable 5.2, Nov 9, 2026: 46x faster than binascii.b2a_qp</desc>
